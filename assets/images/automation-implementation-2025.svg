<?xml version="1.0" encoding="UTF-8"?>
<!-- SVG banner: "How Much Do Automation Services Cost?" -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How Much Do Automation Services Cost?</title>
  <desc id="desc">A modern banner with the headline "How Much Do Automation Services Cost?" featuring a stylized gear icon and gradient background.</desc>

  <defs>
    <!-- background gradient -->
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="1" stop-color="#0b1f3a" />
    </linearGradient>

    <!-- soft panel gradient -->
    <linearGradient id="panelGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- subtle glow/filter -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <!-- subtle highlight -->
    <radialGradient id="gearHighlight" cx="30%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- decorative rounded panel -->
  <rect x="36" y="36" width="1128" height="288" rx="20" ry="20" fill="url(#panelGrad)" filter="url(#softShadow)" />

  <!-- left gear icon group -->
  <g transform="translate(160,180)" aria-hidden="true">
    <!-- gear teeth: 12 small rectangles rotated around center -->
    <g>
      <!-- repeat using 12 rects rotated -->
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(0)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(30)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(60)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(90)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(120)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(150)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(180)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(210)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(240)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(270)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(300)"/>
      <rect x="-6" y="-86" width="12" height="26" rx="3" ry="3" fill="#1fb6ff" transform="rotate(330)"/>
    </g>

    <!-- gear body -->
    <circle r="56" fill="#08263b" stroke="#1fb6ff" stroke-width="4" />
    <!-- inner ring -->
    <circle r="34" fill="#072231" stroke="#0ea5ff" stroke-width="2" />
    <!-- center hub -->
    <circle r="12" fill="#0ea5ff" />

    <!-- subtle highlight on gear -->
    <circle r="56" fill="url(#gearHighlight)" />
  </g>

  <!-- main headline -->
  <g transform="translate(320,140)">
    <text x="0" y="0" font-family="Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="44" fill="#ffffff" letter-spacing="-0.02em">
      <tspan x="0" dy="0">How Much Do</tspan>
      <tspan x="0" dy="54">Automation Services</tspan>
      <tspan x="0" dy="54" fill="#bfe9ff">Cost?</tspan>
    </text>
  </g>

  <!-- subtitle / supporting line -->
  <text x="320" y="270" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" fill="#c7e9ff" opacity="0.9">Transparent pricing, typical ranges, and what affects the cost.</text>

  <!-- subtle geometric accents on the right -->
  <g transform="translate(980,60) rotate(12)" opacity="0.08">
    <rect x="0" y="0" width="140" height="140" rx="16" ry="16" fill="#1fb6ff" />
    <rect x="18" y="18" width="104" height="104" rx="12" ry="12" fill="#fff" />
  </g>

  <!-- small footer note -->
</svg>
