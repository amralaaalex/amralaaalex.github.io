<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Background Pattern -->
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Data Flow Lines (Background) -->
  <path d="M100,200 Q300,150 500,200 T900,180" stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M150,350 Q400,300 650,350 T1000,330" stroke="#10b981" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M80,450 Q350,400 600,450 T950,430" stroke="#f59e0b" stroke-width="2" fill="none" opacity="0.3"/>
  
  <!-- Browser/Web Icon -->
  <g transform="translate(150, 180)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#374151" stroke="#6b7280" stroke-width="2"/>
    <rect x="-35" y="-20" width="70" height="8" rx="4" fill="#6b7280"/>
    <rect x="-35" y="-8" width="70" height="38" rx="2" fill="#1f2937"/>
    <circle cx="-25" cy="-16" r="2" fill="#ef4444"/>
    <circle cx="-15" cy="-16" r="2" fill="#f59e0b"/>
    <circle cx="-5" cy="-16" r="2" fill="#10b981"/>
    <!-- Web content lines -->
    <rect x="-30" y="-2" width="25" height="2" fill="#3b82f6"/>
    <rect x="-30" y="4" width="35" height="2" fill="#10b981"/>
    <rect x="-30" y="10" width="20" height="2" fill="#f59e0b"/>
    <rect x="-30" y="16" width="40" height="2" fill="#8b5cf6"/>
    <rect x="-30" y="22" width="30" height="2" fill="#ef4444"/>
  </g>
  
  <!-- Scraping Arrow -->
  <g transform="translate(280, 210)">
    <path d="M0,0 L60,0 L50,-8 M60,0 L50,8" stroke="#10b981" stroke-width="3" fill="none"/>
    <text x="15" y="-15" font-family="Arial" font-size="12" fill="#10b981" font-weight="600">SCRAPE</text>
  </g>
  
  <!-- Tool Icons Grid -->
  <!-- Python/BeautifulSoup -->
  <g transform="translate(400, 150)">
    <circle cx="0" cy="0" r="25" fill="#ffd43b"/>
    <circle cx="8" cy="8" r="20" fill="#306998" opacity="0.8"/>
    <text x="-8" y="5" font-family="Arial" font-size="16" font-weight="bold" fill="white">Py</text>
    <text x="-25" y="45" font-family="Arial" font-size="12" font-weight="600" fill="#e5e7eb">Python</text>
  </g>
  
  <!-- Scrapy -->
  <g transform="translate(500, 150)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#60a5fa"/>
    <path d="M-10,-10 L10,-10 L15,0 L10,10 L-10,10 L-15,0 Z" fill="white"/>
    <text x="-25" y="45" font-family="Arial" font-size="12" font-weight="600" fill="#e5e7eb">Scrapy</text>
  </g>
  
  <!-- Selenium -->
  <g transform="translate(600, 150)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#10b981"/>
    <rect x="-15" y="-15" width="30" height="20" rx="3" fill="white"/>
    <rect x="-10" y="-5" width="20" height="10" rx="2" fill="#10b981"/>
    <text x="-30" y="45" font-family="Arial" font-size="12" font-weight="600" fill="#e5e7eb">Selenium</text>
  </g>
  
  <!-- Playwright -->
  <g transform="translate(700, 150)">
    <circle cx="0" cy="0" r="25" fill="#f59e0b"/>
    <polygon points="-12,-8 12,-8 8,8 -8,8" fill="white"/>
    <text x="-35" y="45" font-family="Arial" font-size="12" font-weight="600" fill="#e5e7eb">Playwright</text>
  </g>
  
  <!-- Puppeteer -->
  <g transform="translate(800, 150)">
    <circle cx="0" cy="0" r="25" fill="#8b5cf6"/>
    <circle cx="-8" cy="-5" r="4" fill="white"/>
    <circle cx="8" cy="-5" r="4" fill="white"/>
    <path d="M-8,5 Q0,15 8,5" stroke="white" stroke-width="3" fill="none"/>
    <text x="-35" y="45" font-family="Arial" font-size="12" font-weight="600" fill="#e5e7eb">Puppeteer</text>
  </g>
  
  <!-- Requests -->
  <g transform="translate(500, 250)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#ef4444"/>
    <text x="-8" y="5" font-family="Arial" font-size="14" font-weight="bold" fill="white">R</text>
    <text x="-30" y="45" font-family="Arial" font-size="12" font-weight="600" fill="#e5e7eb">Requests</text>
  </g>
  
  <!-- Data Output -->
  <g transform="translate(950, 210)">
    <rect x="-30" y="-20" width="60" height="40" rx="4" fill="#1f2937" stroke="#374151" stroke-width="2"/>
    <rect x="-25" y="-12" width="15" height="2" fill="#10b981"/>
    <rect x="-25" y="-7" width="20" height="2" fill="#3b82f6"/>
    <rect x="-25" y="-2" width="18" height="2" fill="#f59e0b"/>
    <rect x="-25" y="3" width="22" height="2" fill="#8b5cf6"/>
    <rect x="-25" y="8" width="16" height="2" fill="#ef4444"/>
    <text x="-20" y="35" font-family="Arial" font-size="11" fill="#e5e7eb">Data Output</text>
  </g>
  
  <!-- Main Title -->
  <text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="white">
    Top Web Scraping Tools 2025
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="385" text-anchor="middle" font-family="Arial" font-size="20" fill="#94a3b8">
    What's Legal &amp; What Works Best
  </text>
  
  <!-- Legal Shield Icon -->
  <g transform="translate(200, 420)">
    <path d="M0,-20 L-15,0 L0,20 L15,0 Z" fill="#10b981"/>
    <text x="-5" y="2" font-family="Arial" font-size="12" font-weight="bold" fill="white">✓</text>
    <text x="-20" y="40" font-family="Arial" font-size="12" font-weight="600" fill="#10b981">Legal</text>
  </g>
  
  <!-- Performance Icon -->
  <g transform="translate(350, 420)">
    <circle cx="0" cy="0" r="20" fill="#3b82f6"/>
    <polygon points="-8,8 0,-10 8,8" fill="white"/>
    <text x="-30" y="40" font-family="Arial" font-size="12" font-weight="600" fill="#3b82f6">Performance</text>
  </g>
  
  <!-- Reliability Icon -->
  <g transform="translate(500, 420)">
    <rect x="-15" y="-15" width="30" height="30" rx="5" fill="#f59e0b"/>
    <path d="M-8,-5 L-3,5 L8,-8" stroke="white" stroke-width="3" fill="none"/>
    <text x="-25" y="40" font-family="Arial" font-size="12" font-weight="600" fill="#f59e0b">Reliable</text>
  </g>
  
  <!-- Easy to Use Icon -->
  <g transform="translate(650, 420)">
    <circle cx="0" cy="0" r="20" fill="#8b5cf6"/>
    <circle cx="-6" cy="-5" r="2" fill="white"/>
    <circle cx="6" cy="-5" r="2" fill="white"/>
    <path d="M-10,5 Q0,12 10,5" stroke="white" stroke-width="2" fill="none"/>
    <text x="-25" y="40" font-family="Arial" font-size="12" font-weight="600" fill="#8b5cf6">Easy Use</text>
  </g>
  
  <!-- 2025 Badge -->
  <g transform="translate(1000, 420)">
    <rect x="-30" y="-15" width="60" height="30" rx="15" fill="#ef4444"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">2025</text>
    <text x="-15" y="40" font-family="Arial" font-size="12" font-weight="600" fill="#ef4444">Updated</text>
  </g>
  
  <!-- Bottom Features Bar -->
  <rect x="100" y="520" width="1000" height="80" rx="10" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(71, 85, 105, 0.3)" stroke-width="1"/>
  
  <!-- Feature Items -->
  <g transform="translate(150, 550)">
    <circle cx="0" cy="0" r="4" fill="#10b981"/>
    <text x="15" y="-8" font-family="Arial" font-size="13" font-weight="600" fill="white">Legal Guidelines</text>
    <text x="15" y="8" font-family="Arial" font-size="11" fill="#94a3b8">robots.txt &amp; ToS compliance</text>
  </g>
  
  <g transform="translate(350, 550)">
    <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
    <text x="15" y="-8" font-family="Arial" font-size="13" font-weight="600" fill="white">Best Practices</text>
    <text x="15" y="8" font-family="Arial" font-size="11" fill="#94a3b8">Rate limiting &amp; ethics</text>
  </g>
  
  <g transform="translate(550, 550)">
    <circle cx="0" cy="0" r="4" fill="#f59e0b"/>
    <text x="15" y="-8" font-family="Arial" font-size="13" font-weight="600" fill="white">Tool Comparison</text>
    <text x="15" y="8" font-family="Arial" font-size="11" fill="#94a3b8">Speed, features &amp; cost</text>
  </g>
  
  <g transform="translate(750, 550)">
    <circle cx="0" cy="0" r="4" fill="#8b5cf6"/>
    <text x="15" y="-8" font-family="Arial" font-size="13" font-weight="600" fill="white">Code Examples</text>
    <text x="15" y="8" font-family="Arial" font-size="11" fill="#94a3b8">Ready-to-use scripts</text>
  </g>
  
  <g transform="translate(950, 550)">
    <circle cx="0" cy="0" r="4" fill="#ef4444"/>
    <text x="15" y="-8" font-family="Arial" font-size="13" font-weight="600" fill="white">Anti-Detection</text>
    <text x="15" y="8" font-family="Arial" font-size="11" fill="#94a3b8">Proxies &amp; headers</text>
  </g>
  
  <!-- Decorative Data Points -->
  <circle cx="100" cy="100" r="2" fill="#3b82f6" opacity="0.6"/>
  <circle cx="1100" cy="120" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="1050" cy="300" r="2" fill="#f59e0b" opacity="0.7"/>
  <circle cx="80" cy="300" r="2" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="1120" cy="500" r="2" fill="#ef4444" opacity="0.5"/>
  
  <!-- Code Brackets -->
  <text x="50" y="400" font-family="monospace" font-size="24" fill="#374151" opacity="0.3">{</text>
  <text x="1150" y="250" font-family="monospace" font-size="24" fill="#374151" opacity="0.3">}</text>
  
</svg>